plugins {
    id 'com.android.application'
}

android {
    namespace 'app.currencyexchange.widget'
    compileSdk 35

    defaultConfig {
        applicationId 'app.currencyexchange.widget'
        minSdk 26
        targetSdk 34
        versionCode 29
        versionName '1.28'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
